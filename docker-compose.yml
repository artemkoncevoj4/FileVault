services:
  filevault:
    build: .
    container_name: filevault_api
    expose:
      - "8080"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/database.db
      - JWT_KEY=
      - ADMIN_USERNAME=
      - ADMIN_PASSWORD=
      - ASPNETCORE_ENVIRONMENT=Production17
    volumes:
      - ./Storage:/app/Storage
      - ./database.db:/app/database.db
    restart: always

  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    ports:
      - "8443:8443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  caddy_data:
  caddy_config: